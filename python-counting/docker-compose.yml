# Camera services are generated per-device by the dashboard (lib/compose.ts).
# This file ships only the shared inference stack.
services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: triton-inference-server
    restart: unless-stopped
    command: tritonserver --model-repository=/models --strict-model-config=false
    runtime: nvidia
    shm_size: 1gb
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Prometheus metrics
    volumes:
      - ./models:/models
    networks:
      - envisions
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
  triton-model-builder:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: triton-model-builder
    profiles: ["build"]
    runtime: nvidia
    entrypoint: ["/bin/bash", "/tools/build_engine.sh"]
    volumes:
      - ./models:/models
      - ./tools:/tools:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
networks:
  envisions:
    driver: bridge
    name: envisions  # shared with the dashboard compose — without this, compose prefixes the project name and containers land on an isolated network
