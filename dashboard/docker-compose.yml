services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: epiwalk-dashboard:latest
    container_name: epiwalk-dashboard
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "3000:3000"
    runtime: nvidia
    volumes:
      - ../python-counting:/python-counting
      - /var/run/docker.sock:/var/run/docker.sock
      - dashboard-data:/app/data
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    environment:
      - PYTHON_COUNTING_DIR=/python-counting
      - HOST_PYTHON_COUNTING_DIR=${HOST_PYTHON_COUNTING_DIR}
      - SETTINGS_FILE=/app/data/settings.json
      - NODERED_URL=http://nodered:1880
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    networks:
      - default
      - envisions
    depends_on:
      - nodered
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    volumes:
      - nodered-data:/data
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/custom-theme.css:/data/custom-theme.css:ro
    ports:
      - "1880:1880"   # direct access for local dev / debugging only — the
                        # dashboard proxies /automation to this internally
                        # over the envisions network in normal use
    networks:
      - envisions
volumes:
  dashboard-data:
  nodered-data:
networks:
  default: {}
  envisions:
    driver: bridge
    name: envisions
